[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-google-ads"
version = "0.1.0"
description = "Multi-account Google Ads MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "google-ads", "ppc", "advertising", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastmcp>=2.0.0",
    "google-ads>=24.0.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
mcp-google-ads = "gads.server:main"

[tool.hatch.build.targets.wheel]
packages = ["gads"]

[tool.ruff]
line-length = 100
target-version = "py311"
